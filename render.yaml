services:
  - type: web
    name: skillsetu-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://ayush35099-cloud.github.io,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: skillsetu-db
          property: connectionString

databases:
  - name: skillsetu-db
    databaseName: skillsetu
    user: skillsetu_user
    plan: free
