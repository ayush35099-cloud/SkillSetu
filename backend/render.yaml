services:
  - type: web
    name: skillsetu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://ayush35099-cloud.github.io,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: skillsetu-db
          property: connectionString

databases:
  - name: skillsetu-db
    databaseName: skillsetu
    user: skillsetu_user
    plan: free
